[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alignment-diffusion-paper-code"
version = "1.0.0"
description = "Code snapshot for multimodal alignment and conditional diffusion experiments"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = [
  "accelerate>=0.34.0,<2.0",
  "autogluon.multimodal==1.4.0",
  "category-encoders==2.6.3",
  "einops==0.8.0",
  "joblib==1.3.2",
  "langid==1.1.6",
  "matplotlib==3.8.2",
  "numpy==1.26.1",
  "optuna==3.5.0",
  "pandas==2.1.3",
  "scikit-learn==1.6.1",
  "scipy==1.11.4",
  "seaborn==0.13.0",
  "torch>=2.2,<2.8",
  "torchvision>=0.16,<0.23",
  "tqdm==4.66.1",
  "transformers[sentencepiece]>=4.38,<4.50",
  "wandb==0.19.9",
  "xgboost==2.0.3",
]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tabsynfnn*"]
